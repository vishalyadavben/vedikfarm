server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: vedikfarm-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vedikfarm}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:vedikfarm}
    password: ${DB_PASSWORD:vedikfarm}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only validates it matches the entities -
      # it must never auto-generate or alter tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # Generate a real random 256-bit+ secret for production - do not use a short/default one.
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_secret_key_at_least_32_bytes_long}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY_MIN:60}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:vedikfarm-product-images}
    public-base-url: ${R2_PUBLIC_BASE_URL:}

  seller:
    # Used to decide CGST+SGST (same state) vs IGST (different state) on orders.
    state: ${SELLER_STATE:Maharashtra}

  shipping:
    free-above-subtotal: ${SHIPPING_FREE_ABOVE:999.00}
    flat-fee: ${SHIPPING_FLAT_FEE:49.00}
