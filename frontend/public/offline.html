<!doctype html>
<!-- vf-offline: shown by the service worker when the shop can't be reached -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f8636" />
    <title>You're offline - Vedik Farms</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box;
             font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #fdfbf6; color: #2b2b2b; text-align: center; }
      main { max-width: 360px; }
      img { width: 120px; height: 120px; margin-bottom: 1rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; color: #2f4f26; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #555; }
      button { background: #4f8636; color: #fff; border: 0; border-radius: 8px; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Vedik Farms" />
      <h1>You're offline</h1>
      <p>We can't reach Vedik Farms right now. Please check your internet connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
